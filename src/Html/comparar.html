<!DOCTYPE html>

<header class="fixed top-4 inset-x-0 z-50 flex justify-center px-4">
    <nav aria-label="Global"

        bg-purple-900/60 backdrop-blur-md border border-fuchsia-500/30 rounded-full shadow-2xl transition-all duration-300">

        <div class="flex flex-1">
            <a href="../../index.html"
                class="flex items-center gap-1 transition-transform hover:scale-105 active:scale-95">
                <span class="sr-only">Nexos</span>
                <img src="../Imagenes/logo.png" alt="Logo Nexos" class="h-12 w-auto object-contain" />
                <p class="text-2xl font-bold text-white tracking-wider">Nexos</p>
            </a>
        </div>

        <div id="nav-links" class="flex items-center gap-6 lg:gap-x-10">
            <a href="../../index.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Inicio
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="Juegos.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Juegos
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="comparar.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Comparación
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="e-sports.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Esports
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="foro.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Foro
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </div>
    </nav>

    <style>
        @keyframes nexos-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(212, 126, 252, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0);
            }
        }

        .click-pulse {
            animation: nexos-pulse 0.5s ease-out;
        }

        .active-link {
            color: #d47efc !important;
        }

        .active-underline {
            width: 100% !important;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            // Normalizamos la URL actual para comparar
            const currentUrl = window.location.href.toLowerCase();

            navItems.forEach(item => {
                const href = item.getAttribute('href').toLowerCase();

                // Verificamos si la URL actual contiene el nombre del archivo del link
                if (currentUrl.includes(href) || (currentUrl.endsWith('/') && href.includes('index.html'))) {
                    item.classList.add('active-link');
                    const underline = item.querySelector('span');
                    if (underline) underline.classList.add('active-underline');
                }

                item.addEventListener('click', function (e) {
                    // Animación antes de que cambie la página
                    this.classList.add('click-pulse');
                });
            });
        });
    </script>
</header>

<body class="bg-gray-900 overflow-x-hidden min-h-screen flex flex-col">
    <main class="mx-auto max-w-7xl px-6 lg:px-8 py-45 flex-grow">
        <h1 class="text-5xl font-bold text-center text-white mb-12">Comparar Juegos</h1>
        <!-- Esta es la del diseño de la seccion de comparar juegos aparte de llamary cargar la funcionalidad del js -->
        <div class="flex justify-between items-center mb-10 space-x-4">
            <select id="seleccion-juego-a" onchange="cargarComparacion()"
                class="w-full lg:w-2/5 p-3 rounded-lg bg-gray-800 text-white border border-fuchsia-400 focus:ring-fuchsia-500">
                <option value="">Selecciona Juego 1</option>
            </select>
            <span class="text-3xl font-bold text-fuchsia-400 hidden lg:block">vs</span>
            <select id="seleccion-juego-b" onchange="cargarComparacion()"
                class="w-full lg:w-2/5 p-3 rounded-lg bg-gray-800 text-white border border-fuchsia-400 focus:ring-fuchsia-500">
                <option value="">Selecciona Juego 2</option>
            </select>
        </div>

        <!-- Aqui se obliga al usuario que tienen que ser dos juegos diferentes para poder comparar -->
        <div id="comparacion-resultados">
            <p class="text-center text-fuchsia-300">Selecciona dos juegos para empezar la comparación.</p>
        </div>
    </main>
    <!-- Llamada al js de detalle-juegos para la funcionalidad de comparar -->
    <script src="../JS/detalle-juegos.js"></script>
</body>

<!DOCTYPE html>
<html lang="es">

<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

</head>

<header class="fixed top-4 inset-x-0 z-50 flex justify-center px-4">

            </a>
        </div>

        <div id="nav-links" class="flex items-center gap-6 lg:gap-x-10">
            <a href="../../index.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Inicio
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="Juegos.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">

            <a href="comparar.html"

                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>

            <a href="e-sports.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">

            <a href="foro.html"

    <style>
        /* Animación del nav al hacer click — igual que el resto del sitio */
        @keyframes nexos-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(212, 126, 252, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0);
            }
        }

        .click-pulse {
            animation: nexos-pulse 0.5s ease-out;
        }

        .active-link {
            color: #d47efc !important;
        }

        .active-underline {
            width: 100% !important;
        }

        #hero-juego {
            position: relative;
            height: 520px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        /* Imagen de fondo del hero */
        #hero-bg {
            position: absolute;
            inset: -60px 0;
            /* margen extra arriba y abajo para el parallax */
            background-size: cover;
            background-position: center 0%;
            background-repeat: no-repeat;
            transition: background-image 0.4s ease;
            will-change: background-position;
        }

        /* Gradiente oscuro sobre la imagen para que el texto se lea bien */
        #hero-juego::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                    rgba(15, 11, 27, 0.3) 0%,
                    rgba(15, 11, 27, 0.75) 60%,
                    rgba(15, 11, 27, 1) 100%);
            z-index: 1;
        }

        /* Contenido de texto del hero  */
        #hero-contenido {
            position: relative;
            z-index: 5;
            padding: 0 2rem 2.5rem;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Badge de género del juego */
        .hero-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(168, 85, 247, 0.35);
            border: 1px solid rgba(217, 70, 239, 0.4);
            color: #f0abfc;
            margin-bottom: 12px;
        }

        /* Título principal del juego en el hero */
        #hero-titulo-juego {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 900;
            color: #fff;
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 15px;
        }

        /* Subtítulo con lanzamiento y plataformas */
        .hero-meta {
            font-size: 20px;
            color: rgba(216, 180, 254, 0.75);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #main-media-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16/9;
            border-radius: 14px;
            background: #0d0920;
            box-shadow: 0 8px 40px rgba(88, 28, 135, 0.35);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        /* El contenido del media (imagen o video) tiene fade de entrada */
        #main-media-container img,
        #main-media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: mediaFadeIn 0.35s ease both;
        }

        @keyframes mediaFadeIn {
            from {
                opacity: 0;
                transform: scale(1.03);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Flechas de navegación de la galería */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 9, 32, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
            /* ocultas por defecto */
            backdrop-filter: blur(4px);
        }

        /* Las flechas aparecen al hacer hover sobre el contenedor */
        #main-media-container:hover .gallery-arrow {
            opacity: 1;
        }

        .gallery-arrow:hover {
            background: rgba(168, 85, 247, 0.45);
            border-color: #e879f9;
            color: #fff;
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-arrow-left {
            left: 12px;
        }

        .gallery-arrow-right {
            right: 12px;
        }

        /* Contador de media */
        .media-counter {
            position: absolute;
            bottom: 10px;
            right: 14px;
            z-index: 10;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.45);
            padding: 3px 10px;
            border-radius: 9999px;
            backdrop-filter: blur(4px);
        }

        /* Miniaturas de la galería */
        #miniaturas-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.4) transparent;
        }

        #miniaturas-container button {
            flex-shrink: 0;
            width: 88px;
            height: 54px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
            position: relative;
        }

        #miniaturas-container button:hover {
            transform: scale(1.05);
        }

        #miniaturas-container button.activa {
            border-color: #e879f9;
        }

        #detalle-juego {
            color: white;
        }

        /* Tarjetas de tiendas mejoradas */
        .tienda-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 16px;
            background: rgba(31, 21, 55, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s;
            gap: 12px;
        }

        .tienda-card:hover {
            transform: translateX(4px);
        }

        /* Colores de hover por plataforma — se asignan desde JS */
        .tienda-steam:hover {
            border-color: #014a8a;
            background: rgba(27, 158, 218, 0.12);
        }

        .tienda-xbox:hover {
            border-color: #52b043;
            background: rgba(82, 176, 67, 0.12);
        }

        .tienda-playstation:hover {
            border-color: #1b9eda;
            background: rgba(0, 112, 209, 0.12);
        }

        .tienda-gog:hover {
            border-color: #c9541e;
            background: rgba(201, 84, 30, 0.12);
        }

        .tienda-epic:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        .tienda-battle:hover {
            border-color: #00aeff;
            background: rgba(0, 174, 255, 0.12);
        }

        .tienda-eneba:hover {
            border-color: #6fdb6f;
            background: rgba(111, 219, 111, 0.12);
        }

        .tienda-instant:hover {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.12);
        }

        .tienda-default:hover {
            border-color: rgba(217, 70, 239, 0.6);
            background: rgba(168, 85, 247, 0.12);
        }

        .tienda-nombre {
            font-weight: 700;
            font-size: 18px;
            color: #f3e8ff;
        }

        .tienda-precio {
            font-weight: 800;
            font-size: 18px;
            color: #e879f9;
            white-space: nowrap;
        }

        .tienda-icono {
            font-size: 16px;
            color: rgba(216, 180, 254, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pros-contras-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 8px;
        }

        @media (max-width: 640px) {
            .pros-contras-grid {
                grid-template-columns: 1fr;
            }
        }

        .pros-col,
        .contras-col {
            border-radius: 14px;
            padding: 20px;
            opacity: 0;
            /* empieza invisible, GSAP la anima */
        }

        .pros-col {
            background: rgba(16, 185, 129, 0.07);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .contras-col {
            background: rgba(239, 68, 68, 0.07);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .pros-col h3 {
            color: #34d399;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .contras-col h3 {
            color: #f87171;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .pros-col li,
        .contras-col li {
            font-size: 17px;
            line-height: 1.6;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .pros-col li:last-child,
        .contras-col li:last-child {
            border-bottom: none;
        }

        .rating-seccion {
            margin-top: 8px;
        }

        .rating-fila {
            margin-bottom: 16px;
        }

        .rating-label {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 600;
            color: rgba(216, 180, 254, 0.85);
            margin-bottom: 6px;
        }

        .rating-pista {
            height: 8px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 9999px;
            overflow: hidden;
        }

        .rating-barra {
            height: 100%;
            border-radius: 9999px;
            width: 0%;
            /* empieza en 0, se anima hasta el valor real */
            background: linear-gradient(90deg, #7c3aed, #e879f9);
            transition: none;
            /* GSAP controla la animación */
        }
        .relacionado-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            border: 1px solid rgba(168, 85, 247, 0.18);
            background: rgba(17, 12, 34, 0.9);
            transition: border-color 0.3s, box-shadow 0.3s;
            transform-style: preserve-3d;
            will-change: transform;
            display: block;
            opacity: 0;
            /* GSAP anima la entrada */
        }

        .relacionado-card:hover {
            border-color: rgba(217, 70, 239, 0.55);
            box-shadow: 0 0 28px rgba(168, 85, 247, 0.25);
        }

        .relacionado-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .relacionado-card:hover img {
            transform: scale(1.06);
        }

        .relacionado-card .rel-body {
            padding: 12px 14px 14px;
        }

        .relacionado-card .rel-titulo {
            font-size: 18px;
            font-weight: 700;
            color: #f3e8ff;
            margin-bottom: 3px;
            transition: color 0.2s;
        }

        .relacionado-card:hover .rel-titulo {
            color: #e879f9;
        }

        .relacionado-card .rel-genero {
            font-size: 14px;
            color: rgba(167, 139, 250, 0.65);
        }

        /* Overlay de color en las relacionadas */
        .relacionado-card .rel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(88, 28, 135, 0.6) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .relacionado-card:hover .rel-overlay {
            opacity: 1;
        }

        #image-modal {
            backdrop-filter: blur(6px);
        }

        /* Divisores de sección */
        .seccion-titulo {
            font-size: 28px;
            font-weight: 800;
            color: #f3e8ff;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .seccion-titulo::before {
            content: "";
            display: block;
            width: 4px;
            height: 22px;
            border-radius: 2px;
            background: linear-gradient(180deg, #7c3aed, #e879f9);
            flex-shrink: 0;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            const currentUrl = window.location.href.toLowerCase();
            navItems.forEach(item => {
                const href = item.getAttribute('href').toLowerCase();
                if (currentUrl.includes(href) || (currentUrl.endsWith('/') && href.includes('index.html'))) {
                    item.classList.add('active-link');
                    const underline = item.querySelector('span');
                    if (underline) underline.classList.add('active-underline');
                }
                item.addEventListener('click', function () { this.classList.add('click-pulse'); });
            });
        });
    </script>
</header>

<body class="bg-[#0f0b1b] overflow-x-hidden min-h-screen">

            class="w-full h-full max-w-[80%] max-h-[85%] rounded-xl shadow-2xl cursor-pointer object-contain"

    <!-- JS principal con toda la lógica -->
    <script src="../JS/detalle-juegos.js"></script>

    <script>
        /* Variables de estado de la galería */
        let currentGameId = null;
        let currentIndex = 0;

        /* Modal de imagen ampliada */
        function openModal(imageSrc) {
            document.getElementById('modal-image').src = imageSrc;
            document.getElementById('image-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // evitar scroll detrás del modal
        }
        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        /*  Cambiar media principal (imagen o video)  */
        function changeMainMedia(type, source, index) {
            const container = document.getElementById('main-media-container');

            // Guardar flechas y contador antes de limpiar
            const arrowLeft = container.querySelector('.gallery-arrow-left');
            const arrowRight = container.querySelector('.gallery-arrow-right');
            const counter = container.querySelector('.media-counter');

            // Limpiar solo el contenido de media, preservando flechas y contador
            const mediaViejo = container.querySelector('img:not(.gallery-arrow *), video');
            if (mediaViejo) mediaViejo.remove();

            currentIndex = index;

            if (type === 'video') {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.className = 'w-full h-full object-cover';
                const source_el = document.createElement('source');
                source_el.src = source;
                source_el.type = 'video/mp4';
                video.appendChild(source_el);
                // Insertar antes de las flechas para no romper el z-index
                container.insertBefore(video, arrowLeft);
            } else {
                const img = document.createElement('img');
                img.src = source;
                img.alt = 'Contenido del juego';
                img.className = 'w-full h-full object-cover cursor-pointer';
                img.onclick = () => openModal(source);
                container.insertBefore(img, arrowLeft);
            }

            actualizarContador();
            updateActiveThumbnail(index);
        }

        /* Actualizar el contador */
        function actualizarContador() {
            const juego = dataJuegos[currentGameId];
            if (!juego || !juego.galeria) return;
            const counter = document.getElementById('media-counter');
            if (counter) counter.textContent = `${currentIndex + 1} / ${juego.galeria.length}`;
        }

        /* Resaltar miniatura activa */
        function updateActiveThumbnail(activeIndex) {
            const thumbnails = document.querySelectorAll('#miniaturas-container button');
            thumbnails.forEach((btn, i) => {
                btn.classList.toggle('activa', i === activeIndex);
                if (i === activeIndex) {
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        }

        /* Navegar galería (flechas o teclado) */
        function navigateGallery(direction) {
            const juego = dataJuegos[currentGameId];
            if (!juego || !juego.galeria) return;
            const size = juego.galeria.length;
            const newIndex = (currentIndex + direction + size) % size;
            const media = juego.galeria[newIndex];
            changeMainMedia(media.tipo, media.src, newIndex);
        }

        function iniciarParallax() {
            const heroBg = document.getElementById('hero-bg');
            if (!heroBg) return;

            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                // Movemos el fondo verticalmente en proporción al scroll
                heroBg.style.backgroundPosition = `center calc(30% + ${scrollY * 0.4}px)`;
            }, { passive: true });
        }

        document.addEventListener('DOMContentLoaded', () => {

            // Leer el id del juego de la URL 
            const params = new URLSearchParams(window.location.search);
            currentGameId = params.get('id');

            // Cargar toda la información del juego 
            if (typeof cargarDetalleJuego === 'function') {
                cargarDetalleJuego();
            }

            // Iniciar parallax del hero
            iniciarParallax();

            // Navegación con teclas de flecha — igual que el original
            document.addEventListener('keydown', (e) => {
                // No interferir si el usuario está escribiendo
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                if (e.key === 'ArrowLeft') navigateGallery(-1);
                if (e.key === 'ArrowRight') navigateGallery(1);
                // Escape cierra el modal
                if (e.key === 'Escape') closeModal();
            });
        });
    </script>

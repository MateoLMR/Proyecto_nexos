<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexos | Juegos</title>
    <link rel="icon" href="../Imagenes/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<header class="fixed top-4 inset-x-0 z-50 flex justify-center px-4">
    <nav aria-label="Global"
        class="mx-auto flex w-full max-w-7xl items-center justify-between px-10 py-4 
        bg-purple-900/60 backdrop-blur-md border border-fuchsia-500/30 rounded-full shadow-2xl transition-all duration-300">

        <div class="flex flex-1">
            <a href="../../index.html"
                class="flex items-center gap-1 transition-transform hover:scale-105 active:scale-95">
                <span class="sr-only">Nexos</span>
                <img src="../Imagenes/logo.png" alt="Logo Nexos" class="h-12 w-auto object-contain" />
                <p class="text-2xl font-bold text-white tracking-wider">Nexos</p>
            </a>
        </div>

        <div id="nav-links" class="flex items-center gap-6 lg:gap-x-10">
            <a href="../../index.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Inicio
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="Juegos.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Juegos
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="comparar.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Comparación
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="e-sports.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Esports
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="foro.html"
                class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Foro
                <span
                    class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </div>
    </nav>

    <style>
        /* Animación del nav al hacer click */
        @keyframes nexos-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(212, 126, 252, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 126, 252, 0);
            }
        }

        .click-pulse {
            animation: nexos-pulse 0.5s ease-out;
        }

        .active-link {
            color: #d47efc !important;
        }

        .active-underline {
            width: 100% !important;
        }

        /* animación de entrada del título */
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-title {
            animation: fadeSlideDown 0.7s ease both;
        }

        .hero-sub {
            animation: fadeSlideDown 0.7s 0.15s ease both;
        }

        .hero-badge {
            animation: fadeSlideDown 0.7s 0.05s ease both;
        }

        /*  Fondo del hero */
        .hero-bg {
            background: linear-gradient(135deg, #1a0a2e 0%, #111827 50%, #0d0d1f 100%);
            position: relative;
            overflow: hidden;
        }

        /* Aura de color detrás del hero */
        .hero-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 50%, rgba(168, 85, 247, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 50%, rgba(217, 70, 239, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* BARRA DE BÚSQUEDA */
        .search-wrapper {
            position: relative;
        }

        .search-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #a855f7;
        }

        #buscador {
            width: 100%;
            background: rgba(31, 21, 55, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 9999px;
            padding: 12px 20px 12px 48px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            backdrop-filter: blur(8px);
        }

        #buscador::placeholder {
            color: rgba(167, 139, 250, 0.5);
        }

        #buscador:focus {
            border-color: rgba(217, 70, 239, 0.7);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        /* TOGGLE GRID / LISTA */
        .view-btn {
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(31, 21, 55, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: rgba(167, 139, 250, 0.7);
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active,
        .view-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(217, 70, 239, 0.5);
            color: #e879f9;
        }

        /* TARJETAS EN VISTA GRID */
        .juego-card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(17, 12, 34, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            /* perspective para el efecto tilt 3D */
            transform-style: preserve-3d;
            will-change: transform;
        }

        .juego-card:hover {
            border-color: rgba(217, 70, 239, 0.55);
            box-shadow: 0 0 32px rgba(168, 85, 247, 0.22);
        }

        /* Overlay de color que aparece en hover */
        .juego-card .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(192, 37, 158, 0.75) 100%);
            opacity: 0;
            transition: opacity 0.35s;
            z-index: 1;
            pointer-events: none;
        }

        .juego-card:hover .card-overlay {
            opacity: 1;
        }

        /* Badge de tipo (Actual / Antiguo) sobre la imagen */
        .tipo-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            padding: 3px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tipo-actual {
            background: rgba(168, 85, 247, 0.85);
            color: #fff;
        }

        .tipo-antiguo {
            background: rgba(107, 33, 168, 0.7);
            color: #d8b4fe;
        }

        /* Imagen con zoom suave en hover */
        .juego-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .juego-card:hover img {
            transform: scale(1.06);
        }

        /* Contenido de texto de la tarjeta */
        .card-body {
            padding: 14px 16px 18px;
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-titulo {
            font-size: 18px;
            font-weight: 700;
            color: #f3e8ff;
            transition: color 0.2s;
        }

        .juego-card:hover .card-titulo {
            color: #e879f9;
        }

        .card-desc {
            font-size: 16px;
            color: rgba(167, 139, 250, 0.7);
            line-height: 1.5;
            flex: 1;
        }

        /* Pie de la tarjeta con el link "Ver detalles" */
        .card-footer {
            padding: 0 16px 14px;
            display: flex;
            justify-content: flex-end;
        }

        .card-link {
            font-size: 14px;
            font-weight: 600;
            color: #a855f7;
            letter-spacing: 0.5px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .juego-card:hover .card-link {
            color: #e879f9;
        }

        /* VISTA LISTA */
        .lista-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(17, 12, 34, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            padding: 0;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.25s;
        }

        .lista-card:hover {
            border-color: rgba(217, 70, 239, 0.55);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.2);
            transform: translateX(6px);
        }

        .lista-card img {
            width: 140px;
            min-width: 140px;
            height: 90px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .lista-card:hover img {
            transform: scale(1.05);
        }

        .lista-body {
            flex: 1;
            padding: 14px 4px;
        }

        .lista-titulo {
            font-size: 18px;
            font-weight: 700;
            color: #f3e8ff;
            margin-bottom: 4px;
            transition: color 0.2s;
        }

        .lista-card:hover .lista-titulo {
            color: #e879f9;
        }

        .lista-desc {
            font-size: 13px;
            color: rgba(167, 139, 250, 0.65);
            line-height: 1.45;
        }

        .lista-card .tipo-badge {
            position: static;
            margin-bottom: 6px;
            display: inline-block;
        }

        .lista-footer {
            padding: 14px 20px 14px 0;
        }

        .lista-link {
            font-size: 14px;
            font-weight: 600;
            color: #a855f7;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .lista-card:hover .lista-link {
            color: #e879f9;
        }

        /* BOTÓN "CARGAR MÁS"  */
        #btn-cargar-mas {
            display: block;
            margin: 40px auto 0;
            padding: 12px 40px;
            background: rgba(88, 28, 135, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 9999px;
            color: #d8b4fe;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s;
        }

        #btn-cargar-mas:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: #e879f9;
            color: #fff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        /* Estado de carga del botón */
        #btn-cargar-mas.loading {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* MENSAJE "SIN RESULTADOS" */
        #sin-resultados {
            display: none;
            text-align: center;
            padding: 60px 0;
            color: rgba(155, 121, 255, 0.5);
            font-size: 28px;
        }

        /* Las tarjetas empiezan invisibles y el JS les da animación con GSAP */
        .juego-card,
        .lista-card {
            opacity: 0;
        }

        /*  CONTADOR de resultados  */
        #contador-resultados {
            font-size: 16px;
            color: rgba(231, 139, 250, 0.836);
        }
    </style>

    <script>
        /* Lógica del navbar activo  */
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            const currentUrl = window.location.href.toLowerCase();
            navItems.forEach(item => {
                const href = item.getAttribute('href').toLowerCase();
                if (currentUrl.includes(href) || (currentUrl.endsWith('/') && href.includes('index.html'))) {
                    item.classList.add('active-link');
                    const underline = item.querySelector('span');
                    if (underline) underline.classList.add('active-underline');
                }
                item.addEventListener('click', function () {
                    this.classList.add('click-pulse');
                });
            });
        });
    </script>
</header>

<body class="bg-gray-900 overflow-x-hidden min-h-screen">

    <section class="hero-bg pt-45 pb-14 px-6">
        <div class="mx-auto max-w-7xl">
            <div class="flex flex-col lg:flex-row items-center gap-10">

                <!-- Texto del hero -->
                <div class="flex-1 text-center lg:text-left">
                    <span class="hero-badge inline-block px-4 py-1 mb-4 rounded-full text-x font-bold uppercase tracking-widest
                                 bg-fuchsia-900/50 text-fuchsia-300 border border-fuchsia-500/30">
                        ✦ Destacado del mes
                    </span>
                    <h1 id="hero-titulo"
                        class="hero-title text-4xl lg:text-6xl font-black text-white leading-tight mb-4">
                        <!-- Se rellena desde JS -->
                    </h1>
                    <p id="hero-desc" class="hero-sub text-xl text-purple-300/80 max-w-lg mb-8 leading-relaxed">
                        <!-- Se rellena desde JS -->
                    </p>
                    <a id="hero-link" href="#" class="inline-flex items-center gap-2 px-8 py-3 rounded-full font-bold text-white
                              bg-gradient-to-r from-fuchsia-600 to-purple-600
                              hover:from-fuchsia-500 hover:to-purple-500
                              shadow-lg shadow-fuchsia-900/40 transition-all duration-300
                              hover:shadow-fuchsia-500/30 hover:scale-105 active:scale-95">
                        Ver detalles
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                        </svg>
                    </a>
                </div>

                <!-- Imagen del hero con efecto parallax suave en hover -->
                <div class="flex-1 w-full max-w-xl" id="hero-img-wrapper" style="border-radius:20px; overflow:hidden; box-shadow: 0 30px 80px rgba(88,28,135,0.45);
                            border: 1px solid rgba(168,85,247,0.25); transform-style: preserve-3d;">
                    <img id="hero-img" src="" alt="" class="w-full aspect-video object-cover block"
                        style="transition: transform 0.4s ease;" />
                </div>

            </div>
        </div>
    </section>

    <main class="mx-auto px-6 lg:px-48 pt-14 pb-20">

        <!-- Título de sección -->
        <div class="text-center mb-10">
            <h2 class="text-6xl font-bold text-white mb-4">Catálogo de Juegos</h2>
            <p class="text-xl text-fuchsia-300">Explora los mejores juegos actuales</p>
        </div>

        <!--  Barra de herramientas: búsqueda + filtros + toggle vista  -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-4 mb-8">

            <!-- Buscador en tiempo real -->
            <div class="search-wrapper flex-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M17 11A6 6 0 111 11a6 6 0 0116 0z" />
                </svg>
                <!-- El buscador llama a buscarJuegos() en cada tecla -->
                <input type="text" id="buscador" placeholder="Buscar juego..." oninput="buscarJuegos()"
                    autocomplete="off">
            </div>

            <!-- Filtros por tipo (Todos / Actuales / Antiguos) -->
            <div class="flex gap-2 flex-wrap">
                <button id="filter-todos" onclick="filtrarJuegos('todos')"
                    class="filter-btn px-10 py-2 rounded-full text-1xl font-semibold text-white bg-fuchsia-600 hover:bg-fuchsia-700 transition-colors">
                    Todos
                </button>
                <button id="filter-actual" onclick="filtrarJuegos('actual')"
                    class="filter-btn px-10 py-2 rounded-full text-1xl font-semibold text-fuchsia-300 bg-gray-800 hover:bg-gray-700 transition-colors">
                    Actuales
                </button>
                <button id="filter-antiguo" onclick="filtrarJuegos('antiguo')"
                    class="filter-btn px-10 py-2 rounded-full text-1xl font-semibold text-fuchsia-300 bg-gray-800 hover:bg-gray-700 transition-colors">
                    Antiguos
                </button>
            </div>

            <!-- Toggle vista Grid / Lista -->
            <div class="flex gap-2 items-center">
                <!-- Icono grid — cuatro cuadrados -->
                <button class="view-btn active" id="btn-grid" onclick="cambiarVista('grid')" title="Vista cuadrícula">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z" />
                    </svg>
                </button>
                <!-- Icono lista — líneas horizontales -->
                <button class="view-btn" id="btn-lista" onclick="cambiarVista('lista')" title="Vista lista">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>

        </div>

        <!-- Contador de resultados visibles -->
        <div class="flex justify-between items-center mb-4">
            <span id="contador-resultados"></span>
        </div>

        <!-- Mensaje cuando no hay resultados de búsqueda -->
        <div id="sin-resultados">
            <p>🛸 No se encontraron juegos con esa búsqueda.</p>
            <p class="text-xñ mt-2 text-purple-400/40">Intenta con otro nombre.</p>
        </div>

        <!-- Contenedor principal donde JS inyecta las tarjetas -->
        <div id="contenedor-juegos"></div>

        <!-- Botón "Cargar más"  -->
        <button id="btn-cargar-mas" onclick="cargarMas()" style="display:none;">
            ↓ &nbsp; Cargar más juegos
        </button>

    </main>

    <!-- Carga el JS de juegos con toda la lógica -->
    <script src="../JS/Juegos.js"></script>

</body>

        <div class="flex items-center justify-between">
            <p class="text-sm leading-5 text-gray-400">

</footer>

</html>
